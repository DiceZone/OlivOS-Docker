services:
  olivos-app:
    image: shiaworkshop/olivos:latest
    container_name: olivos-main
    working_dir: /app
    volumes:
      - "./OlivOS:/app/OlivOS"
      - "./napcat/config:/app/napcat/config"
    environment:
      - LOGIN_UIN=${ACCOUNT}

    networks:
      - olivos
    depends_on:
      - napcat

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    ports:
      - "6099:6099"
    volumes:
      - "./napcat/config:/app/napcat/config"
      - "./napcat/QQ_DATA:/app/.config/QQ"
      - "./OlivOS:/app/OlivOS"
    environment:
      - ACCOUNT=${ACCOUNT}
    networks:
      - olivos
    mac_address: "02:42:16:74:4c:b0"

networks:
  olivos:
    driver: bridge
