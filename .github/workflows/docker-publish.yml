name: Docker Build and Push

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型：stable（稳定版）或 pre（预发布版）'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - pre
      upstream_tag:
        description: '上游版本标签（如 v0.11.81）'
        required: true
        type: string
  repository_dispatch:
    types: [build]

env:
  DOCKERHUB_REPO: shiaworkshop/olivos
  DOCKERFILE_PATH: OlivOS/Dockerfile

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: 确定构建参数
        id: resolve_params
        run: |
          # workflow_dispatch 场景：从 inputs 获取
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE="${{ inputs.build_type }}"
            UPSTREAM_TAG="${{ inputs.upstream_tag }}"
          else
            # repository_dispatch 场景：从事件 payload 获取
            BUILD_TYPE="${{ github.event.client_payload.build_type }}"
            UPSTREAM_TAG="${{ github.event.client_payload.upstream_tag }}"
          fi

          # fallback: 如果没有传入标签, 从文件读取
          if [ -z "$UPSTREAM_TAG" ]; then
            if [ "$BUILD_TYPE" = "pre" ] && [ -f "pre_release.json" ]; then
              UPSTREAM_TAG=$(jq -r '.tag_name // ""' pre_release.json)
            elif [ -f "last_release.json" ]; then
              UPSTREAM_TAG=$(jq -r '.tag_name // ""' last_release.json)
            fi
            # 如果还是没有值，回退到 latest（不会构建失败）
            if [ -z "$UPSTREAM_TAG" ]; then
              BUILD_TYPE="stable"
              UPSTREAM_TAG="latest"
            fi
          fi

          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV

      - name: 获取上游 Commit SHA
        id: get_commit_sha
        run: |
          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/OlivOS-Team/OlivOS/git/ref/tags/${{ env.UPSTREAM_TAG }}")
          
          COMMIT_SHA=$(echo "$RESPONSE" | jq -r .object.sha)
          SHORT_SHA="sha-${COMMIT_SHA:0:7}"
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            UPSTREAM_TAG=${{ env.UPSTREAM_TAG }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ env.UPSTREAM_TAG }}
            ${{ env.DOCKERHUB_REPO }}:${{ env.SHORT_SHA }}
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ env.BUILD_TYPE }}
